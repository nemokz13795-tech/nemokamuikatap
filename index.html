<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nemokamuika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #050018;
    --purple: #a855f7;
    --purple-light: #c084fc;
    --purple-deep: #6b21a8;
    --blue-dark: #1e1b4b;
    --glow: rgba(168, 85, 247, 0.6);
    --text: #f5f3ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg-deep);
    color: var(--text);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    position: relative;
  }

  /* === IMAGE BACKGROUND === */
  .bg-img {
    position: fixed;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover; /* Растягивает картинку без искажения пропорций */
    z-index: 0;
    filter: brightness(0.45) contrast(1.15) saturate(1.3) hue-rotate(-10deg);
  }

  /* === VIGNETTE / EDGE BLUR === */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background:
      radial-gradient(ellipse 80% 70% at center,
        transparent 0%,
        transparent 35%,
        rgba(10, 4, 32, 0.4) 65%,
        rgba(5, 0, 24, 0.85) 90%,
        rgba(5, 0, 24, 1) 100%);
  }

  .vignette::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg,
        rgba(5, 0, 24, 0.6) 0%,
        transparent 25%,
        transparent 75%,
        rgba(5, 0, 24, 0.8) 100%);
  }

  .vignette::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(107, 33, 168, 0.25) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(30, 27, 75, 0.4) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.08) 0%, transparent 60%);
    mix-blend-mode: screen;
  }

  /* === MAIN CONTAINER === */
  .container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 460px; /* Чуть шире, чтобы 5 иконок отлично поместились */
    padding: 2rem 1.25rem 4rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* === GLITCH TITLE === */
  .glitch-wrapper {
    margin-bottom: 3rem;
    position: relative;
  }

  .glitch {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 9vw, 5rem);
    letter-spacing: 0.04em;
    position: relative;
    color: #fff;
    text-shadow:
      0 0 20px rgba(168, 85, 247, 0.8),
      0 0 40px rgba(168, 85, 247, 0.4);
    line-height: 1;
  }

  .glitch::before,
  .glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .glitch::before {
    color: #ff2bd6;
    z-index: -1;
    animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
    text-shadow: 2px 0 #ff2bd6;
  }

  .glitch::after {
    color: #00e5ff;
    z-index: -2;
    animation: glitch-anim-2 3s infinite linear alternate-reverse;
    text-shadow: -2px 0 #00e5ff;
  }

  @keyframes glitch-anim-1 {
    0%   { clip-path: inset(20% 0 60% 0); transform: translate(-3px, 0); }
    10%  { clip-path: inset(80% 0 5% 0);  transform: translate(3px, 0); }
    20%  { clip-path: inset(40% 0 40% 0); transform: translate(-2px, 0); }
    30%  { clip-path: inset(10% 0 75% 0); transform: translate(2px, 0); }
    40%  { clip-path: inset(60% 0 20% 0); transform: translate(-3px, 0); }
    50%  { clip-path: inset(30% 0 55% 0); transform: translate(1px, 0); }
    60%  { clip-path: inset(70% 0 10% 0); transform: translate(-1px, 0); }
    70%  { clip-path: inset(15% 0 70% 0); transform: translate(3px, 0); }
    80%  { clip-path: inset(55% 0 30% 0); transform: translate(-2px, 0); }
    90%  { clip-path: inset(25% 0 50% 0); transform: translate(2px, 0); }
    100% { clip-path: inset(45% 0 35% 0); transform: translate(-1px, 0); }
  }

  @keyframes glitch-anim-2 {
    0%   { clip-path: inset(70% 0 10% 0); transform: translate(3px, 0); }
    15%  { clip-path: inset(20% 0 60% 0); transform: translate(-3px, 0); }
    30%  { clip-path: inset(50% 0 30% 0); transform: translate(2px, 0); }
    45%  { clip-path: inset(5% 0 80% 0);  transform: translate(-2px, 0); }
    60%  { clip-path: inset(60% 0 20% 0); transform: translate(1px, 0); }
    75%  { clip-path: inset(35% 0 45% 0); transform: translate(-1px, 0); }
    100% { clip-path: inset(15% 0 65% 0); transform: translate(2px, 0); }
  }

  .glitch { animation: glitch-burst 7s infinite; }

  @keyframes glitch-burst {
    0%, 92%, 100% { transform: translate(0, 0); filter: none; }
    93% { transform: translate(-2px, 1px); filter: hue-rotate(20deg); }
    94% { transform: translate(2px, -1px); filter: hue-rotate(-20deg); }
    95% { transform: translate(-1px, 2px); filter: hue-rotate(10deg); }
    96% { transform: translate(1px, -2px); filter: none; }
  }

  /* === SOCIALS (No Frames) === */
  .socials-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.5rem 2rem;
    margin-bottom: 3rem;
  }

  .social-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
    color: var(--purple-light);
    transition: transform 0.3s ease, color 0.3s ease;
    position: relative;
    width: 70px; /* Фиксированная ширина для аккуратной сетки */
  }

  .social-item:hover {
    transform: translateY(-4px);
    color: #fff;
  }

  .social-item:hover .social-icon {
    filter: drop-shadow(0 0 12px var(--glow));
  }

  .social-icon {
    width: 32px;
    height: 32px;
    transition: filter 0.3s ease;
  }

  .social-text {
    font-size: 0.7rem;
    letter-spacing: 0.02em;
    color: rgba(192, 132, 252, 0.6);
    font-weight: 500;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  
  .social-item:hover .social-text {
    color: var(--purple-light);
  }

  /* === KASPI BUTTON (Styled Card) === */
  .kaspi-btn {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.9rem 1.4rem;
    background: linear-gradient(135deg, rgba(15, 10, 46, 0.8) 0%, rgba(30, 27, 75, 0.6) 100%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(168, 85, 247, 0.4);
    border-radius: 50px;
    color: var(--text);
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }

  .kaspi-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(192, 132, 252, 0.2), transparent);
    transition: left 0.6s ease;
  }

  .kaspi-btn:hover::before { left: 100%; }

  .kaspi-btn:hover {
    border-color: var(--purple);
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(30, 27, 75, 0.8) 100%);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(168, 85, 247, 0.3);
  }

  .kaspi-btn:active { transform: translateY(0); }

  .kaspi-icon {
    width: 28px;
    height: 28px;
    color: var(--purple-light);
    flex-shrink: 0;
  }

  .kaspi-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.2;
  }

  .kaspi-title {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #fff;
  }

  .kaspi-sub {
    font-size: 0.75rem;
    color: rgba(192, 132, 252, 0.8);
    font-family: 'Space Grotesk', monospace;
    letter-spacing: 0.05em;
  }

  .kaspi-copy-icon {
    width: 16px;
    height: 16px;
    color: var(--purple-light);
    opacity: 0.6;
    transition: opacity 0.3s;
  }

  .kaspi-btn:hover .kaspi-copy-icon { opacity: 1; }

  .copy-feedback {
    position: absolute;
    right: 1.2rem;
    top: 50%;
    transform: translateY(-50%) translateX(15px);
    background: var(--purple);
    color: #fff;
    padding: 0.4rem 0.8rem;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 12px rgba(168, 85, 247, 0.5);
  }

  .kaspi-btn.copied .copy-feedback {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
  }

  .kaspi-btn.copied .kaspi-copy-icon { opacity: 0; }

  /* === FOOTER === */
  .footer {
    position: fixed;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(192, 132, 252, 0.35);
    z-index: 10;
    white-space: nowrap;
  }

  /* === ENTRANCE ANIMATIONS === */
  .glitch-wrapper { animation: fadeUp 0.8s ease-out; }
  
  .social-item, .kaspi-btn {
    opacity: 0;
    animation: fadeUp 0.6s ease-out forwards;
  }

  .social-item:nth-child(1) { animation-delay: 0.15s; }
  .social-item:nth-child(2) { animation-delay: 0.25s; }
  .social-item:nth-child(3) { animation-delay: 0.35s; }
  .social-item:nth-child(4) { animation-delay: 0.45s; }
  .social-item:nth-child(5) { animation-delay: 0.55s; }
  .kaspi-btn { animation-delay: 0.7s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* === RESPONSIVE === */
  @media (max-width: 480px) {
    .container { padding: 1.5rem 1rem 3.5rem; }
    .socials-grid { gap: 1.5rem 1.5rem; }
    .social-item { width: 65px; }
    .social-icon { width: 28px; height: 28px; }
    .kaspi-btn { padding: 0.8rem 1.2rem; gap: 0.8rem; }
    .footer { font-size: 0.6rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .glitch::before, .glitch::after, .glitch { animation: none; }
  }
</style>
</head>

<script>
  // === КОПИРОВАНИЕ КАРТЫ KASPI ===
  const kaspiCard = document.getElementById('kaspiCard');
  const cardNumber = '4400430308386629';

  const copyToClipboard = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      } catch (err) {
        document.body.removeChild(ta);
        return false;
      }
    }
  };

  const handleKaspiClick = async () => {
    const ok = await copyToClipboard(cardNumber);
    if (ok) {
      kaspiCard.classList.add('copied');
      setTimeout(() => kaspiCard.classList.remove('copied'), 2000);
    }
  };

  kaspiCard.addEventListener('click', handleKaspiClick);
  kaspiCard.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      handleKaspiClick();
    }
  });

  // === ЛЁГКИЙ ПАРАЛЛАКС ФОНА КАРТИНКИ ===
  const bgImg = document.querySelector('.bg-img');
  let ticking = false;
  
  window.addEventListener('mousemove', (e) => {
    if (!ticking) {
      window.requestAnimationFrame(() => {
        const x = (e.clientX / window.innerWidth - 0.5) * 15;
        const y = (e.clientY / window.innerHeight - 0.5) * 15;
        if (bgImg) {
          bgImg.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        }
        ticking = false;
      });
      ticking = true;
    }
  });
</script>
